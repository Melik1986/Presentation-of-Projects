name: Branch Protection

on:
  pull_request:
    branches:
      - main

jobs:
  check-source-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Check if PR is from portfolio branch
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"
          TARGET_BRANCH="${{ github.base_ref }}"

          echo "Source branch: $SOURCE_BRANCH"
          echo "Target branch: $TARGET_BRANCH"

          if [[ "$SOURCE_BRANCH" == "portfolio" ]] && [[ "$TARGET_BRANCH" == "main" ]]; then
            echo ""
            echo "❌ ============================================"
            echo "❌  BLOCKED: Cannot merge portfolio into main!"
            echo "❌ ============================================"
            echo ""
            echo "💡 Reminder:"
            echo "   - main = Template for buyers"
            echo "   - portfolio = Your custom version"
            echo ""
            echo "🔒 These branches must stay separate!"
            echo ""
            echo "Please close this Pull Request."
            echo ""
            exit 1
          fi

          echo "✅ Branch check passed!"
          exit 0
